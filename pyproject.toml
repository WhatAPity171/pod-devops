[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pod-devops-demo"
version = "0.1.0"
description = "Tiny demo project for CI/build artifacts."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Student" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2.2",
  "pytest>=8.0.0",
  "ruff>=0.5.0",
]

[project.scripts]
pod-devops-demo = "pod_devops_demo.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
