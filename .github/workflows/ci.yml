name: CI

on:
  push:
    branches: ["ino_dev"]
  pull_request:
    branches: ["ino_dev"]

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: Build
        run: python -m build

      - name: Upload artifacts (dist)
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/**
